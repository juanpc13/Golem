# Golem — the world is Gazebo Fortress in kiosk mode: physics server, ROS<->Gazebo bridge,
# rosbridge and the GUI start on their own, no desktop.
# Bring up:  docker compose up -d --build
# Watch:     http://localhost:6080  (the picture WITH the lab's buttons: four crates, clear, top view)
#            http://localhost:6080/vnc.html?autoconnect=true&resize=scale  (the bare picture)
#            (Gazebo's picture IS the screen, straight above the floor, scaled to the browser)
# Operate:   http://localhost:8081 (blue-golem) · http://localhost:8082 (red-golem)
#            http://localhost:8083 (green-golem: lives on its wheels' reckoning, like a real robot)
#            http://localhost:8084 (yellow-golem) — the fleet of four (29-sep-2026)
# Membrane:  ws://localhost:9090  (rosbridge: the bodies' topics as JSON)
services:
  sim:
    build: ./sim
    image: golem-sim:gazebo
    container_name: golem-sim
    ports:
      - "6080:80"    # the kiosk: the levers' page WITH the picture (the bare viewer at /vnc.html)
      - "9090:9090"  # rosbridge (the membrane)
    environment:
      - KIOSK=true   # false = headless: physics and bridges only, no picture (saves ~5 cores of software rendering)
      # The bodies' nodes (sim/bridge/body.py): each body takes its golem's orders and reports to its golem's endpoints
      - GOLEMS=blue=http://blue-golem:8080;red=http://red-golem:8080;green=http://green-golem:8080;yellow=http://yellow-golem:8080
      - POSE_SOURCES=   # every body on the world's pose for now (29-sep-2026); green=wheels puts green's body on its wheels' reckoning
    shm_size: 512m
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped

  # The golems (GolemAPI, ASP.NET controllers on :8080 inside). One golem per body, all
  # from the same image — only the environment differs. GOLEM is the identity (names the
  # journal); BODY is the model it drives in the world (sim/world/plan.json declares the
  # bodies); HOME_AT is the body's mark: a reborn golem puts its body there, and so does
  # "let go". Journals live in ./journal on the host — inspectable, they outlive containers.
  # RULE: one writer per journal — never point two processes at the same GOLEM.
  #
  # ROLES is what the body can do — its capabilities, one role each: `displacer` (the motors: the errand, the turn
  # and the move reported), `collision-captor` (the bumper: the bump reported, the forget). The golem plays only the
  # roles declared and an endpoint whose role the body lacks answers 409; unset, it plays them all.
  # POSE_SOURCE is where a golem's idea of its position comes from: "world" (default) hands
  # it the simulator's true pose — a gift no real robot gets; "wheels" makes it live on dead
  # reckoning from its wheels, anchored once at start-up, so being blocked or pushed shows
  # up as the gap between what it believes and what the world says (the panel draws both).
  # blue and red live on the truth; green is the one that lives like a real robot.
  #
  # Tells travel container-to-container over the HttpBroker wire: TELL_ROUTES maps
  # each tell topic to the peer that subscribes it (acks travel back on
  # <topic>.acks over the same table), and TELL_DONE_TO=<peer> makes a golem tell
  # that peer every point it visits. Only ONE direction of TELL_DONE_TO between two
  # golems — a told mission is journaled like any other and would echo back forever.
  blue-golem:
    build:
      context: .
      dockerfile: GolemAPI/Dockerfile
    image: golemapi
    container_name: blue-golem
    ports:
      - "8081:8080"  # blue's endpoints + panel
    environment:
      - ROSBRIDGE_URL=ws://sim:9090
      - JOURNAL_PATH=/golem/journal
      - GOLEM=blue
      - WARDEN=warden      # the warden it answers to (propuesta 88): the choreography's words go there, its place comes from there
      - BODY=blue
      - ROLES=displacer,collision-captor   # the capabilities of this body: the motors and the bumper (18-sep-2026)
      - HOME_AT=6.3,10.4
      - PANEL_PORT=8080
      # tells TO red go to red; acks for tells addressed to ME return to red (the teller);
      # the route to green carries no tells — it only lets "reset everything" reach green too
      - TELL_ROUTES=tell-red=http://red-golem:8080,tell-blue.acks=http://red-golem:8080,tell-green=http://green-golem:8080,tell-yellow=http://yellow-golem:8080,tell-warden=http://warden:8080
      - TELL_RETRY_SECONDS=30
    volumes:
      - ./journal:/golem/journal
    depends_on:
      - sim
    restart: unless-stopped

  red-golem:
    build:
      context: .
      dockerfile: GolemAPI/Dockerfile
    image: golemapi
    container_name: red-golem
    ports:
      - "8082:8080"  # red's endpoints + panel
    environment:
      - ROSBRIDGE_URL=ws://sim:9090
      - JOURNAL_PATH=/golem/journal
      - GOLEM=red
      - WARDEN=warden      # the warden it answers to (propuesta 88): the choreography's words go there, its place comes from there
      - BODY=red
      - ROLES=displacer,collision-captor   # the capabilities of this body: the motors and the bumper (18-sep-2026)
      - HOME_AT=2.5,2.5
      - PANEL_PORT=8080
      # tells TO blue go to blue; acks for tells addressed to ME return to blue;
      # the route to green carries no tells — it only lets "reset everything" reach green too
      - TELL_ROUTES=tell-blue=http://blue-golem:8080,tell-red.acks=http://blue-golem:8080,tell-green=http://green-golem:8080,tell-yellow=http://yellow-golem:8080,tell-warden=http://warden:8080
      - TELL_RETRY_SECONDS=30
      # - TELL_DONE_TO=blue  # red tells blue every visited point — off for the choreographies (29-sep-2026): a follower leaves its place
    volumes:
      - ./journal:/golem/journal
    depends_on:
      - sim
    restart: unless-stopped

  # The third golem lives as a real robot would: nobody hands it the world's truth. Its pose
  # is dead reckoning from its own wheels, anchored once when it binds; the panel shows, for
  # the operator only, where the world says its body really is. Nobody tells it anything —
  # its routes exist so that "reset everything" reaches all three.
  green-golem:
    build:
      context: .
      dockerfile: GolemAPI/Dockerfile
    image: golemapi
    container_name: green-golem
    ports:
      - "8083:8080"  # green's endpoints + panel
    environment:
      - ROSBRIDGE_URL=ws://sim:9090
      - JOURNAL_PATH=/golem/journal
      - GOLEM=green
      - WARDEN=warden      # the warden it answers to (propuesta 88): the choreography's words go there, its place comes from there
      - BODY=green
      - ROLES=displacer,collision-captor   # the capabilities of this body: the motors and the bumper (18-sep-2026)   # the capabilities of this body: the motors and the bumper (18-sep-2026)
      - HOME_AT=10,10.5
      - POSE_SOURCE=world   # for now (29-sep-2026); wheels = dead reckoning, anchored once, like a real robot
      - PANEL_PORT=8080
      - TELL_ROUTES=tell-blue=http://blue-golem:8080,tell-red=http://red-golem:8080,tell-yellow=http://yellow-golem:8080,tell-warden=http://warden:8080
      - TELL_RETRY_SECONDS=30
    volumes:
      - ./journal:/golem/journal
    depends_on:
      - sim
    restart: unless-stopped

  # yellow (29-sep-2026, the fleet of four for the choreographies): the same golem, on the world's pose, told everything.
  yellow-golem:
    build:
      context: .
      dockerfile: GolemAPI/Dockerfile
    image: golemapi
    container_name: yellow-golem
    ports:
      - "8084:8080"  # yellow's endpoints + panel
    environment:
      - ROSBRIDGE_URL=ws://sim:9090
      - JOURNAL_PATH=/golem/journal
      - GOLEM=yellow
      - WARDEN=warden      # the warden it answers to (propuesta 88): the choreography's words go there, its place comes from there
      - BODY=yellow
      - ROLES=displacer,collision-captor
      - HOME_AT=9.5,1.5
      - POSE_SOURCE=world
      - PANEL_PORT=8080
      - TELL_ROUTES=tell-blue=http://blue-golem:8080,tell-red=http://red-golem:8080,tell-green=http://green-golem:8080,tell-warden=http://warden:8080
      - TELL_RETRY_SECONDS=30
    volumes:
      - ./journal:/golem/journal
    depends_on:
      - sim
    restart: unless-stopped

  # THE WARDEN (propuesta 88, 2-oct-2026; Juan: "un actor/servicio nuevo para coordinar a los demás golems… el CLI principal"): the same
  # image, no body — ROLES=warden, no BODY, no HOME_AT, no ROS. It convenes the formations, applies the law once and shares the places;
  # its console carries any line to any golem (`golem blue visit 2,9.5`, `golem all enter open-floor`). Its panel: the board.
  warden:
    build:
      context: .
      dockerfile: GolemAPI/Dockerfile
    image: golemapi
    container_name: warden
    ports:
      - "8080:8080"  # the warden's endpoints + panel (the main console)
    environment:
      - JOURNAL_PATH=/golem/journal
      - GOLEM=warden
      - WARDEN=warden
      - ROLES=warden
      - PANEL_PORT=8080
      - MY_URL=http://warden:8080
      - TELL_ROUTES=tell-blue=http://blue-golem:8080,tell-red=http://red-golem:8080,tell-green=http://green-golem:8080,tell-yellow=http://yellow-golem:8080
      - TELL_RETRY_SECONDS=30
    volumes:
      - ./journal:/golem/journal
    restart: unless-stopped
