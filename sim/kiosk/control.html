<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golem — control</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:14px; background:#1a1a2e; color:#e0e0e8;
         font-family:system-ui, sans-serif; }
  h1 { font-size:1.1rem; font-weight:600; margin:0; }
  #pad { display:grid; grid-template-columns:repeat(3, 72px); grid-auto-rows:72px; gap:8px; }
  button { font-size:1.6rem; border:0; border-radius:12px; background:#2e2e4e; color:#e0e0e8;
           cursor:pointer; }
  button:active { background:#4a4a8a; }
  #up{grid-column:2} #left{grid-column:1;grid-row:2} #stop{grid-column:2;grid-row:2}
  #right{grid-column:3;grid-row:2} #down{grid-column:2;grid-row:3}
  #pose { font-family:monospace; font-size:0.85rem; color:#8a8ab0; }
  #status { font-size:0.8rem; color:#8a8ab0; }
</style>
</head>
<body>
<h1>🐢 turtle1</h1>
<div id="pad">
  <button id="up">▲</button>
  <button id="left">◀</button>
  <button id="stop">■</button>
  <button id="right">▶</button>
  <button id="down">▼</button>
</div>
<div id="pose">waiting for pose…</div>
<div id="status">connecting…</div>
<script>
const TOPIC_VEL = '/turtle1/cmd_vel';
const ws = new WebSocket('ws://' + location.hostname + ':9090');

ws.onopen = () => {
  ws.send(JSON.stringify({op:'advertise', topic:TOPIC_VEL, type:'geometry_msgs/Twist'}));
  ws.send(JSON.stringify({op:'subscribe', topic:'/turtle1/pose', throttle_rate:200}));
  document.getElementById('status').textContent = 'connected to rosbridge';
};
ws.onclose = () => document.getElementById('status').textContent = 'disconnected';
ws.onmessage = (m) => {
  const d = JSON.parse(m.data);
  if (d.topic === '/turtle1/pose')
    document.getElementById('pose').textContent =
      `x=${d.msg.x.toFixed(2)}  y=${d.msg.y.toFixed(2)}  θ=${d.msg.theta.toFixed(2)}`;
};

function drive(lin, ang) {
  ws.send(JSON.stringify({op:'publish', topic:TOPIC_VEL,
    msg:{linear:{x:lin,y:0,z:0}, angular:{x:0,y:0,z:ang}}}));
}
const actions = { up:[2,0], down:[-2,0], left:[0,1.57], right:[0,-1.57], stop:[0,0] };
for (const [id,[lin,ang]] of Object.entries(actions))
  document.getElementById(id).onclick = () => drive(lin, ang);

// keyboard arrows work too
const keys = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', ' ':'stop' };
document.addEventListener('keydown', (e) => {
  if (keys[e.key]) { e.preventDefault(); document.getElementById(keys[e.key]).click(); }
});
</script>
</body>
</html>
